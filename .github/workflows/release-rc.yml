name: Release RC

on:
  push:
    branches:
      - next
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to prepare release candidate from'
        required: false
        default: 'next'
        type: string

env:
  # NX release needs to have a GH token in env.GITHUB_TOKEN
  # As during this workflow we will create a new release
  # that should trigger other workflow, we need to create custom TOKEN
  # with proper permissions,
  # more: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens
  GITHUB_TOKEN: ${{ secrets.WORKFLOW_PAT }}

jobs:
  release:
    name: Release RC
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # needed for npm provenance
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch || github.ref }}
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install

      - name: Print Environment Info
        run: npx nx report

      - name: Build types
        run: npm run build:types

      - name: Verify RC package version
        run: |
          VERSION="$(node -p "require('./libs/types/package.json').version")"
          test "$VERSION" = "2.0.0-rc.1"

      - name: Publish RC packages
        run: npx nx release publish --projects=@blue-repository/types --tag next --first-release --verbose
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
